name: CI

on:
  push:
    branches: [main, stable]
  pull_request:
    branches: [main, stable]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Verify cmake
        run: cmake --version

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build

      # nozzle-dev#198: a change to a source list alone must rerun CMake.
      - name: Rebuild when only a source list changes
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          list=nozzle/sources/common.txt
          cp "$list" "$RUNNER_TEMP/common.txt"
          { tail -n 1 "$RUNNER_TEMP/common.txt"; sed '$d' "$RUNNER_TEMP/common.txt"; } > "$list"
          cargo build -vv 2>&1 | tee "$RUNNER_TEMP/rebuild.log"
          grep -E 'Running .*build-script-build' "$RUNNER_TEMP/rebuild.log"
          grep 'Configuring done' "$RUNNER_TEMP/rebuild.log"
          cp "$RUNNER_TEMP/common.txt" "$list"

      - name: Test
        run: cargo test

      - name: Package list
        run: cargo package --list

      - name: Publish dry-run
        run: cargo publish --dry-run

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18"

      - name: Set LIBCLANG_PATH
        shell: bash
        run: printf '%s\n' "LIBCLANG_PATH=$LLVM_PATH/bin" >> "$GITHUB_ENV"

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test

      - name: Package list
        run: cargo package --list

      - name: Publish dry-run
        run: cargo publish --dry-run

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libdrm-dev libgbm-dev libegl-dev libgl-dev llvm-dev libclang-dev clang

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test

      - name: Package list
        run: cargo package --list

      - name: Publish dry-run
        run: cargo publish --dry-run

  msrv-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libdrm-dev libgbm-dev libegl-dev libgl-dev llvm-dev libclang-dev clang

      - uses: dtolnay/rust-toolchain@1.82

      - name: Build with MSRV
        run: cargo build

      - name: Test with MSRV
        run: cargo test
